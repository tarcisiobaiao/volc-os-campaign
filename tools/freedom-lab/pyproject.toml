# Freedom Lab — ambiente Python do laboratório descartável.
# Gerenciado por uv (instalado num venv de ferramenta: tools/freedom-lab/.uv-tool).
# Toda dependência direta precisa de linha em DEPENDENCIAS.json; o teste
# test_manifesto_cobre_lock falha se faltar. google-ads fica FORA de propósito
# (OR-Tools prende protobuf <6.34); dados do Google entram por snapshot do broker.
[project]
name = "volc-freedom-lab"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "numpy>=2.3,<3",
  "pandas>=2.3,<4",
  "polars>=1.30,<3",
  "pyarrow>=21",
  "duckdb>=1.3,<2",
  "scipy>=1.16,<2",
  "scikit-learn>=1.7,<2",
  "ortools>=9.14,<10",
  "jsonschema>=4.25,<5",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
test = ["pytest>=8"]

[tool.uv]
package = false
# Janela de frescor: nada publicado há menos de 7 dias da resolução.
exclude-newer = "2026-10-08T00:00:00Z"
default-groups = ["test"]
