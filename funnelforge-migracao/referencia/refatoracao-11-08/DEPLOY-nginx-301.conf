# 301 de PR2 e PR3 para a pré-sell canônica (PR1)
#
# Por que não deu para fazer pela API: o site não tem o plugin Redirection
# (nenhuma rota REST), e o `_yoast_wpseo_canonical` não está registrado para
# REST — a escrita retorna 200 e é descartada em silêncio.
#
# Estado atual: PR2 e PR3 continuam publicadas, mas já estão ÓRFÃS — nenhum link
# interno aponta para elas desde a troca dos botões da LP. O 301 é o que
# consolida os sinais e fecha a duplicação.
#
# ONDE: /etc/nginx/sites-available/creditoup.com.br
# Colar DENTRO do bloco `server` do :443, ANTES do `location / {`.
# As locations regex são avaliadas na ordem de declaração.

location ~ ^/rec/quem-tem-direito-antecipar-fgts-pr[23]/?$ {
    return 301 https://creditoup.com.br/rec/quem-tem-direito-antecipar-fgts-pr1/$is_args$args;
}

# Deploy:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Aceite — esperado 301 nas duas primeiras, 200 na terceira, query preservada:
#   curl -sI 'https://creditoup.com.br/rec/quem-tem-direito-antecipar-fgts-pr2/' | head -2
#   curl -sI 'https://creditoup.com.br/rec/quem-tem-direito-antecipar-fgts-pr3/' | head -2
#   curl -sI 'https://creditoup.com.br/rec/quem-tem-direito-antecipar-fgts-pr1/' | head -2
#   curl -sI 'https://creditoup.com.br/rec/quem-tem-direito-antecipar-fgts-pr2/?utm_source=t' | grep -i location
#
# Não pode haver cadeia PR2 -> PR3 -> PR1, nem 302, nem loop.
# Depois do deploy: remover PR2 e PR3 do sitemap XML do Yoast.
#
# Reversão: comentar o bloco e recarregar o nginx. O conteúdo das duas páginas
# continua intacto no WordPress — nada foi apagado.
