# MATRIZ DO BENCHMARK de modelos — configurações COMPLETAS do funil, não
# respostas isoladas. Cada entrada sobrepõe `steps.<passo>.model/fallbacks` do
# config.yaml. `atual` é a referência e não pode ser removida.
#
# Nada aqui roda sozinho: `python -m funnelforge.benchmark preparar` só escreve
# um config por entrada e imprime os comandos `run-volc`. Rodar é decisão humana
# (custo real), sobre a MESMA arquitetura, com `publish: false`.
fixture: tests/fixtures/jornada_senac/arquitetura.json
repeticoes: 3            # variância de LLM: compare medianas, não um run
editorial_v2: true       # a linha que vai a produção: briefing + revisor + escrita natural
# CONDIÇÕES DE PARADA (custo real). Por run e por página o motor para sozinho
# (budget do config gerado). O total é do operador: some `custo_total_usd` de
# `pontuar` depois de cada run e pare ao passar de `max_usd_total`.
orcamento: {max_usd_por_run: 4.00, max_usd_por_pagina: 1.20, max_usd_total: 45.00}
configuracoes:
  atual: {}
  redacao_flash_3_8:
    # candidata: mesmo provedor da redação, preço promocional até 31/12/2026.
    write_p1:   {model: gemini/gemini-3.8-flash, fallbacks: [gpt-4.1]}
    write_page: {model: gemini/gemini-3.8-flash, fallbacks: [gpt-4.1]}
    widget:     {model: gemini/gemini-3.8-flash, fallbacks: [gpt-4.1]}
  estruturados_luna:
    # candidata: passos de rótulo/JSON simples no modelo econômico atual.
    seo:         {model: gpt-6-luna, fallbacks: [gpt-4.1]}
    image:       {model: gpt-6-luna, fallbacks: [gpt-4.1]}
    engajamento: {model: gpt-6-luna, fallbacks: [gpt-4.1]}
  juiz_gpt_6_sol:
    # candidata: juiz/revisor de outro provedor que o redator. gpt-5.1 saiu da
    # matriz: deprecated (desligamento 2027-04-01); gpt-6-sol é o substituto
    # oficial.
    judge:   {model: gpt-6-sol, fallbacks: [gpt-4.1]}
    revisor: {model: gpt-6-sol, fallbacks: [gpt-4.1]}
