# funnel-forge/pyproject.toml
[project]
name = "funnelforge"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "litellm>=1.50", "pydantic>=2.7", "typer>=0.12", "pillow>=10.3",
  "httpx>=0.27", "python-docx>=1.1", "jinja2>=3.1", "tenacity>=8.3",
  "pyyaml>=6.0", "python-dotenv>=1.0",
  # orjson is required by LiteLLM's tool/grounding path (e.g. Gemini
  # web-search grounding via tools=[{"googleSearch": {}}]); without it the
  # research web_search call raises ModuleNotFoundError and degrades to sparse.
  "orjson>=3.10",
]
[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-mock>=3.14", "ruff>=0.5"]
# Optional: real screenshots of the official destination pages (step_screenshot).
# Install with: pip install -e '.[screenshots]' && playwright install chromium
screenshots = ["playwright>=1.44"]
[project.scripts]
funnelforge = "funnelforge.cli:app"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
funnelforge = ["prompts/*.jinja", "templates/*.json", "politicas/*.json"]
[tool.pytest.ini_options]
# `src` entra no sys.path pelo próprio pytest. Sem isto a suíte dependia do
# `__editable__.funnelforge-1.0.0.pth` do venv, que o Python 3.14 ignora quando
# o arquivo tem a flag oculta do macOS (UF_HIDDEN): 76 erros de coleta com
# "No module named 'funnelforge'" sempre que PYTHONPATH=src faltava.
# Esta seção passa a ser o configfile do motor (antes era o pytest.ini da raiz);
# os padrões de coleta da raiz estão repetidos para a coleta não mudar.
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py", "testes_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*", "prova_*"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "E501"]
