; Configuração de coleta do pytest para o repositório inteiro.
;
; ⚠️ POR QUE ESTE ARQUIVO EXISTE
;
; O padrão do pytest para `python_files` é `test_*.py` e `*_test.py`. Os testes
; do engine se chamam `testes_*.py` — português — e por isso NÃO eram coletados
; por varredura de diretório. Medido em 18/08/2026: `pytest volc_ads/` devolvia
; "no tests collected", enquanto chamar os cinco arquivos por caminho explícito
; rodava 69 testes, todos passando.
;
; O defeito não é o nome dos arquivos: é uma suíte que não roda e não avisa.
; Adicionar 8 testes e ver o total continuar em 381 foi como isto apareceu.
; É o mesmo defeito que `backend/tests/conftest.py` já tinha consertado do lado
; do ambiente, com outra roupa.
;
; Rodar tudo, da raiz:
;     backend/.venv/bin/python -m pytest backend/tests volc_ads -q

[pytest]
; ⚠️ `asyncio_mode = auto` PRECISA existir aqui, e não só em `backend/pytest.ini`.
;
; O `rootdir`/`configfile` do pytest é escolhido pelo ancestral comum dos
; ARGUMENTOS. `pytest backend/tests` resolve para `backend/pytest.ini`, que já
; declara `asyncio_mode = auto`. Mas o comando que ESTE arquivo documenta logo
; abaixo — `pytest backend/tests volc_ads`, a partir da raiz — tem a raiz como
; ancestral comum e passa a ler ESTE arquivo, onde o modo não existia. O padrão
; do pytest-asyncio 1.x é STRICT, e em STRICT todo `async def` sem decorador
; falha com "async def functions are not natively supported".
;
; Medido em 08/09/2026, no mesmo commit, sem alterar uma linha de teste:
;     pytest backend/tests              ->  2 failed, 4589 passed   (mode=AUTO)
;     pytest backend/tests volc_ads     -> 18 failed, 5333 passed   (mode=STRICT)
; As 16 falhas extras eram `backend/tests/test_meta_supply_bytes.py` inteiro —
; a prova de bytes do abastecimento Meta —, que passa 19/19 quando roda sozinho.
;
; É o MESMO defeito que o bloco abaixo descreve com outra roupa: o comando
; oficial da suíte devolvia um resultado que não era o do código, e a diferença
; aparecia como falha alheia em vez de como configuração ausente.
asyncio_mode = auto

python_files = test_*.py testes_*.py
python_classes = Test*
python_functions = test_* teste_* prova_*
