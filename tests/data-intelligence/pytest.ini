; Isola a suíte do laboratório: com este arquivo o rootdir passa a ser este
; diretório e o conftest.py da raiz (volc_ads.hermetico_testes) não é carregado.
; Rodar a partir da raiz do repositório:
;   experiments/data-intelligence-lab/.venv/bin/python -m pytest tests/data-intelligence -q
[pytest]
python_files = test_*.py
python_functions = test_*
addopts = -p no:cacheprovider
