[pytest]
# `asyncio_mode = auto` para que os testes de orquestração (`async def`) rodem
# no gate oficial sem cada arquivo precisar de um decorador.
#
# ⚠️ Sem isto, `./scripts/gates-backend.sh` COLETA os testes assíncronos e os
# pula com um aviso, e a contagem verde afirma uma cobertura que não existe —
# exatamente o defeito que o cabeçalho do próprio gate descreve sobre os dois
# módulos que não coletavam sem o SDK do Google.
asyncio_mode = auto
